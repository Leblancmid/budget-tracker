<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- viewport-fit=cover: the app draws under the status bar and home indicator (see the safe-area padding) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Budget</title>

    <!-- Installable app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- The app draws its own header behind the clock and battery -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The header's colour; kept in step with the theme (here and in ThemeProvider) -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      (function () {
        let dark = false
        try {
          const stored = localStorage.getItem('theme')
          dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#111827' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
