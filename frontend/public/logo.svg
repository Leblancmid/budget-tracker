<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="30" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="18" y1="14" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="line" x1="10" y1="48" x2="54" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>

  <!-- Tile + glow -->
  <rect width="64" height="64" rx="16" fill="url(#tile)"/>
  <rect width="64" height="64" rx="16" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Coin -->
  <circle cx="32" cy="30" r="15" fill="url(#coin)"/>
  <circle cx="32" cy="30" r="11" stroke="#92400e" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M26 24.5c2.5-1.8 9.5-1.8 12 0" stroke="#fffbeb" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round"/>

  <!-- Rising line through the coin -->
  <path d="M11 47 L23 38 L31 42 L44 27 L53 19" stroke="#0b1020" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 47 L23 38 L31 42 L44 27 L53 19" stroke="url(#line)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="53" cy="19" r="3.5" fill="#a7f3d0"/>
</svg>
