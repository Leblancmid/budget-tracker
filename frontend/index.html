<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <!-- viewport-fit=cover: the app draws under the status bar and home indicator (see the safe-area padding) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Budget</title>

    <!-- Installable app ("Add to Home Screen") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      The app draws its own header behind the clock and battery, so that area always matches the
      theme and switches with it. No theme-color on purpose: an installed iPhone app reads it once at
      launch and paints a solid bar with it, which then ignores the theme switch.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      (function () {
        let dark = false
        try {
          const stored = localStorage.getItem('theme')
          dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {}
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
